name: Deploy SupplySense to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2 Free Tier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Code to AWS EC2
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Syncing updated code to EC2 instance..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pem' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./ ${EC2_USER}@${EC2_HOST}:~/SupplySense/

      - name: Rebuild & Restart Containers on EC2
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${EC2_USER}@${EC2_HOST} << 'EOF'
            cd ~/SupplySense
            export NEXT_PUBLIC_API_URL="http://$(curl -s http://checkip.amazonaws.com || curl -s ifconfig.me):8000/api/v1"
            sudo docker compose build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
            sudo docker compose up -d
            sudo docker ps
          EOF
